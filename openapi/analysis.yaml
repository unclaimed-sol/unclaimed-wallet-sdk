# Generated by npm run openapi:generate; edit the draft or generator.
openapi: 3.1.0
info:
  title: Unclaimed API
  version: 0.1.0-preview
  summary: Mounted safe-mode wallet analysis and execution preview
  description: Implemented safe analysis and opt-in execution preview. Build and
    record routes require EXECUTION_PREVIEW_ENABLED; it defaults off. Execution
    still requires separately authorized migration and deployment. No payments,
    usage endpoint, max-mode dust burns or gasless execution.
servers:
  - url: /api/v1
    description: Relative to the operator-provided platform origin; no deployment is
      implied.
security:
  - apiKey: []
tags:
  - name: analysis
    description: Metered wallet analysis.
  - name: execution
    description: Unbilled, session-scoped transaction construction and recording.
paths:
  /check-wallet:
    post:
      tags:
        - analysis
      operationId: checkWallet
      summary: Analyze one wallet page
      description: Analyze a frozen wallet page in safe mode. Required lookup failures
        return an incomplete error without a partial or invoiceable page. At
        most 400 raw token accounts; each page accepts limit 1–200 (default 20).
        First-page excess results may overlap cleanup; alternative groups must
        not be added together. Idempotency is mandatory, including retries.
        Execution availability is explicit per item and session.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SdkVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckWalletRequest"
      responses:
        "200":
          description: Complete page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckWalletResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Revoked key, or `mode_not_permitted`: the key lacks the `max`
            capability. Never silently downgraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "410":
          description: "snapshot_expired: the shared 60-minute snapshot and cursor
            lifetime expired; start a new first page. Session lifetime is shared
            when enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          description: Unsupported JSON content encoding or charset. Journaled without
            admission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            `mode_not_available` (max analysis is not mounted yet),
            `invalid_wallet`, `cursor_mismatch`, `airdrops_not_available`
            (Preview), `wallet_too_large` (Preview: more than 400 raw token
            accounts), or a v1 module limit exceeded. Not invoiceable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Sanitized internal analysis failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: >
            `incomplete` (Preview: a required lookup on this page failed after

            bounded retry; retry with the same cursor), `upstream_unavailable`,

            `platform_unavailable` (persistence outcome uncertain), or

            `platform_failure_recorded` (confirmed stored terminal failure).

            Retry `platform_unavailable` with the same Idempotency-Key and
            request:

            an uncertain commit may already have a durable response to replay.

            For `platform_failure_recorded`, a deliberate new attempt uses a new

            key and the same cursor/settings; the old key replays the failure.

            Respect Retry-After when supplied. Never infer durability from
            requestId.

            The error response itself does not publish an invoiceable page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          $ref: "#/components/responses/Timeout"
  /build:
    post:
      tags:
        - execution
      operationId: build
      summary: Build unsigned transactions for selected items
      description: |
        v1 section 15.3. Authenticated by the execution session from
        `check-wallet`, not the API key. Preview narrowing: only
        `burn_and_close` and `recover_excess_lamports`; `stage` is never
        accepted; no partner claim token; no sale receipt. Every item is
        freshly validated; an item whose reviewed balance changed returns
        `changed` with no bytes. Preview downgrade: `burn_and_close` uses the
        existing on-chain instruction and burns whatever balance is present at
        execution; the `consent` text on the item must be displayed.
      security:
        - apiKey: []
          executionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
      responses:
        "200":
          description: Every requested item received a validation decision. Not every item
            necessarily produced bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing, malformed, or invalid execution session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet, item, or action outside the session authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`active_build_pending`: an overlapping build generation in this
            session must be recorded or reconciled first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Session expired; run `check-wallet` again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: More than 20 items, or `build_plan_too_large`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "`mutually_exclusive_items`: two items share an
            `alternativeGroupId`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Fresh on-chain validation could not complete safely. No bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          $ref: "#/components/responses/Timeout"
  /executions/record:
    post:
      tags:
        - execution
      operationId: recordExecution
      summary: Report signatures for verification and recording
      description: |
        v1 section 15.5. Authenticated by the execution receipt from `build`.
        The backend verifies each signature against the stored exact message
        bytes and expected signer, fetches the transaction, reconciles every
        receipt item against post-transaction account state, and records
        verified recovery. Preview: no partner credit is applied; the
        canonical signature-purpose reservation still records `api_execution`
        so the same signature can never later earn website cashback. Idempotent
        by signature and receipt hash.
      security:
        - executionReceipt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRequest"
      responses:
        "200":
          description: Every receipt item has a terminal outcome, or the report duplicates
            one already terminal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        "202":
          description: At least one item is still `pending`, `unknown`, or
            `not_signed_pending_expiry`. Retry later with the same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing, malformed, or invalid execution receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wallet or transaction ID does not belong to this receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Receipt expired before any record was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "`signature_message_mismatch`: the signature does not bind to the
            stored message bytes for that transaction."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "`upstream_unavailable`: status reconciliation could not complete,
            or `credit_admission_paused` during the signature-purpose migration.
            Retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Customer API key. Never sent to `/build` or `/executions/record`.
    executionSession:
      type: apiKey
      in: header
      name: X-Unclaimed-Execution-Session
      description: Opaque bearer session token from `check-wallet`.
    executionReceipt:
      type: apiKey
      in: header
      name: X-Unclaimed-Execution-Receipt
      description: Opaque receipt token from `build`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required, 1–128 printable non-space ASCII characters. Same
        customer, key and canonical body replays the stored response without
        another admission or invoiceable outcome. A separate non-admitted,
        noninvoiceable replay usage row is recorded.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
    SdkVersion:
      name: X-Unclaimed-SDK-Version
      in: header
      required: false
      description: Diagnostics only; never changes results or metering.
      schema:
        type: string
        maxLength: 64
  schemas:
    CheckWalletRequest:
      type: object
      additionalProperties: false
      required:
        - wallet
      properties:
        wallet:
          $ref: "#/components/schemas/Base58"
        mode:
          type: string
          enum:
            - safe
          default: safe
          description: "Only safe analysis is available. Max requests are refused: 403
            without capability, 422 with capability. Never silently downgraded."
        includeAirdrops:
          type: boolean
          default: false
          description: "Preview: must be false; true returns 422 `airdrops_not_available`."
          const: false
        sellAndCloseMaxUsd:
          type: string
          default: "1.00"
          pattern: ^(?:[1-9](?:\.\d{1,6})?|10(?:\.0{1,6})?)$
          description: Accepted for v1 compatibility. Preview never returns an executable
            sell.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        cursor:
          type:
            - string
            - "null"
          description: Opaque `nextCursor` from a prior page. Omit or null for the first
            page.
          pattern: ^ucur_[A-Za-z0-9_-]{43}$
    Base58:
      type: string
      pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
    CheckWalletResponse:
      type: object
      required:
        - requestId
        - apiVersion
        - rulesetVersion
        - assetIntelligenceRulesetVersion
        - analyzedAt
        - complete
        - data
        - billing
      properties:
        requestId:
          type: string
        apiVersion:
          type: string
          enum:
            - v1-preview
        rulesetVersion:
          type: string
        assetIntelligenceRulesetVersion:
          type: "null"
          description: "Preview: always null; no Asset Intelligence is served."
        analyzedAt:
          type: string
          format: date-time
        complete:
          type: boolean
          enum:
            - true
          description: Always true on a 200. Incomplete pages are refused, not served.
        data:
          type: object
          required:
            - wallet
            - mode
            - summary
            - pagination
            - items
            - airdrops
            - executionSession
            - limits
          properties:
            wallet:
              $ref: "#/components/schemas/Base58"
            mode:
              type: string
              enum:
                - safe
            summary:
              type: object
              description: Presentation-only, current page plus first-page wallet modules.
                Never a whole-wallet total while `hasMore` is true.
              required:
                - scope
                - analyzedAssetAccounts
                - opportunityCount
                - protectedAssetCount
                - totalsByAsset
                - estimatedNetValueUsd
              properties:
                scope:
                  type: string
                  enum:
                    - page
                analyzedAssetAccounts:
                  type: integer
                opportunityCount:
                  type: integer
                protectedAssetCount:
                  type: integer
                totalsByAsset:
                  type: array
                  items:
                    type: object
                    required:
                      - asset
                      - decimals
                      - grossBaseUnits
                      - serviceFeeBaseUnits
                      - netBaseUnits
                    properties:
                      asset:
                        type: string
                      mint:
                        $ref: "#/components/schemas/Base58"
                      decimals:
                        type: integer
                      grossBaseUnits:
                        $ref: "#/components/schemas/IntegerString"
                      serviceFeeBaseUnits:
                        $ref: "#/components/schemas/IntegerString"
                      netBaseUnits:
                        $ref: "#/components/schemas/IntegerString"
                estimatedNetValueUsd:
                  type:
                    - string
                    - "null"
                  description: Null whenever any required price input is missing or stale.
            pagination:
              type: object
              required:
                - returned
                - hasMore
                - nextCursor
                - walletModulesIncluded
                - expiresAt
              properties:
                returned:
                  type: integer
                  description: Raw token accounts analyzed on this page, including those with no
                    opportunity.
                hasMore:
                  type: boolean
                nextCursor:
                  type:
                    - string
                    - "null"
                walletModulesIncluded:
                  type: boolean
                  description: True only on the first page.
                expiresAt:
                  type: string
                  format: date-time
                  description: Shared snapshot and cursor expiry. Session lifetime is shared when
                    enabled.
            items:
              type: array
              items:
                $ref: "#/components/schemas/WalletItem"
            airdrops:
              type: "null"
            executionSession:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/ExecutionSession"
              description: Issued only when execution preview is enabled. Shares snapshot
                expiry.
            limits:
              type: object
              required:
                - maxRawTokenAccounts
                - pageLimitMax
              properties:
                maxRawTokenAccounts:
                  type: integer
                  enum:
                    - 400
                  description: Preview cap, enforced before enrichment.
                pageLimitMax:
                  type: integer
                  enum:
                    - 200
          allOf:
            - if:
                properties:
                  items:
                    contains:
                      properties:
                        opportunity:
                          properties:
                            executionSupported:
                              const: true
                          required:
                            - executionSupported
                      required:
                        - opportunity
              then:
                properties:
                  executionSession:
                    $ref: "#/components/schemas/ExecutionSession"
        billing:
          $ref: "#/components/schemas/Billing"
    IntegerString:
      type: string
      pattern: ^[0-9]+$
      description: Integer base units as a decimal string. Never a JSON number.
    WalletItem:
      type: object
      description: One discriminated item. Preview omits `discardEvidence` and
        `classification.reputation` entirely rather than nulling them.
      required:
        - id
        - kind
        - source
        - classification
        - opportunity
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - token_account
            - excess_lamports
        source:
          type: string
          enum:
            - spl_token
            - token_2022
            - excess_lamports
          description: For disappeared or unsupported accounts, the platform retains the
            source from its address-bound frozen inventory. It never supplies
            missing current account facts from that snapshot.
        targetAccount:
          $ref: "#/components/schemas/Base58"
          description: Exact target of an excess-lamports item. No current token balance
            is inferred from frozen inventory.
        alternativeGroupId:
          type: string
          description: Present on every excess-lamports item for a token account and on
            the token-account item for the same account. The two are
            alternatives, never additive.
        asset:
          type: object
          required:
            - mint
            - assetType
            - decimals
          properties:
            mint:
              $ref: "#/components/schemas/Base58"
            assetType:
              type: string
              enum:
                - fungible
                - token_account_collectible
                - unknown
            symbol:
              type:
                - string
                - "null"
            decimals:
              type: integer
        account:
          type: object
          required:
            - address
            - program
            - balanceBaseUnits
            - rentLamports
          additionalProperties: false
          properties:
            address:
              $ref: "#/components/schemas/Base58"
            program:
              type: string
              enum:
                - spl_token
                - token_2022
            balanceBaseUnits:
              $ref: "#/components/schemas/IntegerString"
            rentLamports:
              $ref: "#/components/schemas/IntegerString"
        classification:
          type: object
          required:
            - disposition
            - confidence
            - reviewRequired
            - reasons
            - protections
          properties:
            disposition:
              type: string
              enum:
                - closeable_empty
                - withdrawable
                - protected
                - review_only
                - no_op
              description: Safe analysis only. Max-mode burn candidates are unavailable. Sell
                candidates are returned as `review_only`.
            confidence:
              type: string
              enum:
                - known
                - high
                - low
            reviewRequired:
              type: boolean
            reasons:
              type: array
              items:
                type: string
                enum:
                  - zero_balance
                  - priced_dust_within_policy
                  - sell_not_supported_in_preview
                  - above_dust_threshold
                  - above_net_rent
                  - frozen
                  - collectible
                  - lp_or_position_shaped
                  - receipt_token_policy
                  - dangerous_token_2022_extension
                  - account_missing
                  - unsupported_account
                  - positive_wsol
                  - unpriced
                  - completed_no_sell_route
                  - unsupported_signer
                  - non_positive_net
                  - excess_above_rent_exempt_minimum
            protections:
              type: array
              items:
                type: string
                enum:
                  - frozen
                  - collectible
                  - lp_position
                  - receipt_token
                  - token_2022_extension
                  - unpriced
                  - account_state
        market:
          type: object
          description: Present on fungible token-account items.
          required:
            - quoteStatus
            - sellRouteAvailable
            - executableQuoteUsd
            - quotedAt
          properties:
            quoteStatus:
              type: string
              enum:
                - complete
                - unavailable
            sellRouteAvailable:
              type:
                - boolean
                - "null"
              description: Null when a route was not requested; false only for a completed
                no-route lookup.
            executableQuoteUsd:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/DecimalUsd"
            quotedAt:
              type:
                - string
                - "null"
              format: date-time
          allOf:
            - if:
                properties:
                  quoteStatus:
                    const: unavailable
              then:
                properties:
                  sellRouteAvailable:
                    const: null
                  executableQuoteUsd:
                    const: null
                  quotedAt:
                    const: null
              else:
                properties:
                  sellRouteAvailable:
                    type: boolean
                  quotedAt:
                    type: string
                    format: date-time
            - if:
                properties:
                  sellRouteAvailable:
                    const: false
              then:
                properties:
                  executableQuoteUsd:
                    const: null
        opportunity:
          oneOf:
            - $ref: "#/components/schemas/BurnAndCloseOpportunity"
            - $ref: "#/components/schemas/RecoverExcessLamportsOpportunity"
            - $ref: "#/components/schemas/NoActionOpportunity"
          discriminator:
            propertyName: action
            mapping:
              burn_and_close: "#/components/schemas/BurnAndCloseOpportunity"
              recover_excess_lamports: "#/components/schemas/RecoverExcessLamportsOpportunity"
              none: "#/components/schemas/NoActionOpportunity"
      allOf:
        - if:
            properties:
              kind:
                const: excess_lamports
          then:
            required:
              - targetAccount
              - alternativeGroupId
            not:
              required:
                - account
            properties:
              source:
                const: excess_lamports
              classification:
                properties:
                  disposition:
                    const: withdrawable
                  confidence:
                    const: known
                  reviewRequired:
                    const: true
                  reasons:
                    const:
                      - excess_above_rent_exempt_minimum
                  protections:
                    maxItems: 0
              opportunity:
                properties:
                  action:
                    const: recover_excess_lamports
          else:
            not:
              required:
                - targetAccount
            properties:
              source:
                enum:
                  - spl_token
                  - token_2022
              classification:
                properties:
                  disposition:
                    enum:
                      - closeable_empty
                      - protected
                      - review_only
                      - no_op
                  reasons:
                    not:
                      contains:
                        const: excess_above_rent_exempt_minimum
              opportunity:
                properties:
                  action:
                    enum:
                      - none
                      - burn_and_close
        - if:
            required:
              - account
            properties:
              account:
                properties:
                  program:
                    const: spl_token
          then:
            properties:
              source:
                const: spl_token
        - if:
            required:
              - account
            properties:
              account:
                properties:
                  program:
                    const: token_2022
          then:
            properties:
              source:
                const: token_2022
        - if:
            required:
              - market
          then:
            required:
              - account
              - asset
            properties:
              kind:
                const: token_account
              asset:
                properties:
                  assetType:
                    const: fungible
        - if:
            properties:
              opportunity:
                properties:
                  action:
                    const: burn_and_close
          then:
            required:
              - account
              - asset
            properties:
              kind:
                const: token_account
              source:
                enum:
                  - spl_token
                  - token_2022
              classification:
                properties:
                  disposition:
                    enum:
                      - closeable_empty
                  reviewRequired:
                    const: true
                  protections:
                    maxItems: 0
        - if:
            properties:
              classification:
                properties:
                  disposition:
                    const: closeable_empty
          then:
            required:
              - account
              - asset
            properties:
              account:
                properties:
                  balanceBaseUnits:
                    const: "0"
              opportunity:
                properties:
                  action:
                    const: burn_and_close
                  reviewedBalanceBaseUnits:
                    const: "0"
        - if:
            properties:
              classification:
                properties:
                  reasons:
                    contains:
                      enum:
                        - account_missing
                        - unsupported_account
          then:
            properties:
              classification:
                properties:
                  disposition:
                    const: protected
                  protections:
                    contains:
                      const: account_state
              opportunity:
                properties:
                  action:
                    const: none
            not:
              required:
                - market
    DecimalUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: USD with six decimals, as a string.
    BurnAndCloseOpportunity:
      type: object
      description: |
        Preview downgrade (contract section 6): executes on the existing
        on-chain instruction, which burns whatever balance is present when the
        transaction runs. Every instance is destructive and carries the
        consent text, including accounts reviewed as empty.
      required:
        - action
        - destructive
        - executionSupported
        - consent
        - reviewedBalanceBaseUnits
        - valueComponents
        - costs
        - estimatedNetValueUsd
        - estimated
      properties:
        action:
          type: string
          enum:
            - burn_and_close
        destructive:
          type: boolean
          enum:
            - true
        executionSupported:
          type: boolean
          description: True only when the execution preview is enabled and this action is
            supported.
        consent:
          type: string
          minLength: 1
          description: Exact text the integration must show before signing. States the
            reviewed balance and that execution burns whatever balance is
            present when the transaction runs; for `assumed_worthless` items
            also that no price was available.
        reviewedBalanceBaseUnits:
          $ref: "#/components/schemas/IntegerString"
          description: The balance the user is reviewing. Zero for empty-account close.
        valueComponents:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/ValueComponent"
              - properties:
                  source:
                    const: token_account_close
        costs:
          $ref: "#/components/schemas/OpportunityCosts"
        estimatedNetValueUsd:
          type:
            - string
            - "null"
        estimated:
          type: boolean
          enum:
            - true
    ValueComponent:
      type: object
      required:
        - source
        - gross
        - serviceFee
        - netAfterServiceFee
      properties:
        source:
          type: string
          enum:
            - token_account_close
            - excess_lamports
        gross:
          $ref: "#/components/schemas/Amount"
        serviceFee:
          $ref: "#/components/schemas/Amount"
        netAfterServiceFee:
          $ref: "#/components/schemas/Amount"
    Amount:
      type: object
      required:
        - asset
        - decimals
        - baseUnits
      properties:
        asset:
          type: string
          description: "`SOL` in the preview. Other assets appear only when a fee or gross
            value is denominated in them."
        mint:
          $ref: "#/components/schemas/Base58"
        decimals:
          type: integer
          minimum: 0
          maximum: 18
        baseUnits:
          $ref: "#/components/schemas/IntegerString"
    OpportunityCosts:
      type: object
      required:
        - scope
        - oneTimeSetup
        - estimatedNetworkFee
        - nativeFundingRequired
      properties:
        scope:
          type: string
          enum:
            - standalone_estimate
        oneTimeSetup:
          $ref: "#/components/schemas/Amount"
        estimatedNetworkFee:
          $ref: "#/components/schemas/Amount"
        nativeFundingRequired:
          $ref: "#/components/schemas/Amount"
    RecoverExcessLamportsOpportunity:
      type: object
      required:
        - action
        - destructive
        - executionSupported
        - valueComponents
        - costs
        - estimatedNetValueUsd
        - estimated
      properties:
        action:
          type: string
          enum:
            - recover_excess_lamports
        destructive:
          type: boolean
          enum:
            - false
        executionSupported:
          type: boolean
          description: True only when the execution preview is enabled and this action is
            supported.
        valueComponents:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/ValueComponent"
              - properties:
                  source:
                    const: excess_lamports
        costs:
          type: "null"
          description: Null while the analysis adapter supplies no network/funding
            estimate. Never infer zero cost.
        estimatedNetValueUsd:
          type: "null"
          description: No USD valuation is supplied by this analysis adapter.
        estimated:
          type: boolean
          enum:
            - true
    NoActionOpportunity:
      type: object
      description: Protected, review-only, and no-op items. Never executable.
      required:
        - action
        - destructive
        - executionSupported
        - valueComponents
        - estimated
      properties:
        action:
          type: string
          enum:
            - none
        destructive:
          type: boolean
          enum:
            - false
        executionSupported:
          type: boolean
          enum:
            - false
        valueComponents:
          type: array
          maxItems: 0
        estimated:
          type: boolean
          enum:
            - true
    ExecutionSession:
      type: object
      required:
        - id
        - token
        - expiresAt
      properties:
        id:
          type: string
          description: Non-secret identifier.
        token:
          type: string
          description: Bearer capability for `/build`. Keep out of URLs
          logs: null
          and telemetry.: null
        expiresAt:
          type: string
          format: date-time
    Billing:
      type: object
      description: |
        Preview: `mode` is always `metered_preview`. `chargedUsd` is the list
        price recorded for this complete response and is invoiceable by manual
        invoice only. `balanceRemainingUsd` is always null because no prepaid
        balance exists in the preview.
      required:
        - mode
        - currency
        - billableUnits
        - baseChargeUsd
        - addOnChargeUsd
        - chargedUsd
        - balanceRemainingUsd
      properties:
        mode:
          type: string
          enum:
            - metered_preview
        currency:
          type: string
          enum:
            - USD
        billableUnits:
          type: integer
          minimum: 1
        baseChargeUsd:
          $ref: "#/components/schemas/DecimalUsd"
        addOnChargeUsd:
          $ref: "#/components/schemas/DecimalUsd"
        chargedUsd:
          $ref: "#/components/schemas/DecimalUsd"
        balanceRemainingUsd:
          type: "null"
    ErrorEnvelope:
      type: object
      required:
        - requestId
        - error
      properties:
        requestId:
          type: string
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - key_revoked
                - mode_not_permitted
                - mode_not_available
                - idempotency_key_reused
                - request_in_progress
                - snapshot_expired
                - request_too_large
                - invalid_wallet
                - cursor_mismatch
                - airdrops_not_available
                - wallet_too_large
                - module_limit_exceeded
                - rate_limited
                - internal_error
                - invalid_idempotency_key
                - platform_unavailable
                - platform_failure_recorded
                - invalid_request
                - incomplete
                - upstream_unavailable
                - deadline_exceeded
                - session_mismatch
                - session_expired
                - item_not_in_session
                - execution_in_progress
                - invalid_receipt
                - receipt_mismatch
                - receipt_expired
                - invalid_signature
                - credit_admission_paused
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: Never contains upstream URLs, credentials, raw RPC messages, or
                provider names.
    BuildRequest:
      type: object
      required:
        - wallet
        - items
      properties:
        wallet:
          $ref: "#/components/schemas/Base58"
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required:
              - id
              - action
            properties:
              id:
                type: string
              action:
                type: string
                enum:
                  - burn_and_close
                  - recover_excess_lamports
            additionalProperties: false
      additionalProperties: false
    BuildResponse:
      type: object
      required:
        - requestId
        - analysisRequestId
        - apiVersion
        - analysisRulesetVersion
        - rulesetVersion
        - builtAt
        - transactions
        - items
        - plan
        - executionReceipt
        - warnings
      properties:
        requestId:
          type: string
        analysisRequestId:
          type: string
        apiVersion:
          type: string
          enum:
            - v1-preview
        analysisRulesetVersion:
          type: string
        rulesetVersion:
          type: string
          description: Ruleset applied by this fresh build. May narrow
          never loosen: null
          the analyzed action.: null
        builtAt:
          type: string
          format: date-time
        transactions:
          type: array
          maxItems: 20
          items:
            type: object
            required:
              - id
              - itemIds
              - format
              - submission
              - unsignedTransaction
              - lastValidBlockHeight
              - estimatedNetworkFee
            properties:
              id:
                type: string
              itemIds:
                type: array
                items:
                  type: string
              format:
                type: string
                enum:
                  - solana_legacy_base64
              submission:
                type: string
                enum:
                  - direct_solana
              unsignedTransaction:
                type: string
                description: Base64. Unsigned. Contains placeholder signature slots.
              lastValidBlockHeight:
                $ref: "#/components/schemas/IntegerString"
              estimatedNetworkFee:
                $ref: "#/components/schemas/Amount"
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/BuiltItem"
              - $ref: "#/components/schemas/NotBuiltItem"
            discriminator:
              propertyName: status
              mapping:
                built: "#/components/schemas/BuiltItem"
                changed: "#/components/schemas/NotBuiltItem"
                rejected: "#/components/schemas/NotBuiltItem"
        plan:
          type: object
          required:
            - transactionCount
            - estimatedTotalTransactionCount
            - currentStageCosts
            - costs
            - estimatedNetValueUsd
            - valuation
          properties:
            transactionCount:
              type: integer
            estimatedTotalTransactionCount:
              type: integer
              description: Equal to `transactionCount` for every preview action.
            currentStageCosts:
              $ref: "#/components/schemas/PlanCosts"
            costs:
              $ref: "#/components/schemas/PlanCosts"
            estimatedNetValueUsd:
              type:
                - string
                - "null"
            valuation:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Valuation"
        executionReceipt:
          oneOf:
            - type: "null"
            - type: object
              required:
                - token
                - expiresAt
                - partnerAttribution
              properties:
                token:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                  description: Seven days after build.
                partnerAttribution:
                  type: boolean
                  enum:
                    - false
                  description: "Preview: always false."
          description: Null only when no transaction was built.
        warnings:
          type: array
          items:
            type: string
    BuiltItem:
      type: object
      description: An item that produced bytes. Fresh authoritative amounts are
        mandatory so the integration reviews build-time values, not
        analysis-time estimates.
      required:
        - id
        - status
        - authoritativeOpportunity
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - built
        authoritativeOpportunity:
          oneOf:
            - $ref: "#/components/schemas/AuthoritativeBurnAndClose"
            - $ref: "#/components/schemas/AuthoritativeRecoverExcessLamports"
          discriminator:
            propertyName: action
            mapping:
              burn_and_close: "#/components/schemas/AuthoritativeBurnAndClose"
              recover_excess_lamports: "#/components/schemas/AuthoritativeRecoverExcessLamports"
    AuthoritativeBurnAndClose:
      type: object
      required:
        - action
        - reviewRequired
        - consent
        - reviewedBalanceBaseUnits
        - valueComponents
        - costs
        - estimatedNetValueUsd
      properties:
        action:
          type: string
          enum:
            - burn_and_close
        reviewRequired:
          type: boolean
          enum:
            - true
        consent:
          type: string
          minLength: 1
          description: Refreshed at build time with the fresh reviewed balance.
        reviewedBalanceBaseUnits:
          $ref: "#/components/schemas/IntegerString"
          description: The balance re-read at build; the value stored against the receipt
            for the section 6 measurement.
        valueComponents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ValueComponent"
        costs:
          $ref: "#/components/schemas/ItemCosts"
        estimatedNetValueUsd:
          type:
            - string
            - "null"
    ItemCosts:
      type: object
      required:
        - scope
        - oneTimeSetup
      properties:
        scope:
          type: string
          enum:
            - item_attributable
        oneTimeSetup:
          $ref: "#/components/schemas/Amount"
    AuthoritativeRecoverExcessLamports:
      type: object
      required:
        - action
        - reviewRequired
        - valueComponents
        - costs
        - estimatedNetValueUsd
      properties:
        action:
          type: string
          enum:
            - recover_excess_lamports
        reviewRequired:
          type: boolean
        valueComponents:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ValueComponent"
        costs:
          $ref: "#/components/schemas/ItemCosts"
        estimatedNetValueUsd:
          type:
            - string
            - "null"
    NotBuiltItem:
      type: object
      required:
        - id
        - status
        - reason
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - changed
            - rejected
        reason:
          type: string
          enum:
            - balance_changed
            - account_closed
            - authority_changed
            - frozen
            - protected_by_current_ruleset
            - unsupported_in_preview
            - over_wire_limit
        currentBalanceBaseUnits:
          $ref: "#/components/schemas/IntegerString"
          description: Present for `balance_changed` where safe to disclose.
    PlanCosts:
      type: object
      required:
        - scope
        - oneTimeSetup
        - estimatedNetworkFee
        - nativeFundingRequired
      properties:
        scope:
          type: string
          enum:
            - current_stage_total
            - plan_total
        oneTimeSetup:
          $ref: "#/components/schemas/Amount"
        estimatedNetworkFee:
          $ref: "#/components/schemas/Amount"
        nativeFundingRequired:
          $ref: "#/components/schemas/Amount"
    Valuation:
      type: object
      required:
        - currency
        - calculatedAt
        - inputs
      properties:
        currency:
          type: string
          enum:
            - USD
        calculatedAt:
          type: string
          format: date-time
        inputs:
          type: array
          items:
            type: object
            required:
              - asset
              - pricingMethod
              - unitPriceUsd
              - pricedAt
              - maximumAgeSeconds
            properties:
              asset:
                type: string
              mint:
                $ref: "#/components/schemas/Base58"
              pricingMethod:
                type: string
                enum:
                  - market_quote
                  - fixed_parity
              unitPriceUsd:
                $ref: "#/components/schemas/DecimalUsd"
              pricedAt:
                type: string
                format: date-time
              maximumAgeSeconds:
                type: integer
    RecordRequest:
      type: object
      required:
        - wallet
        - transactions
      properties:
        wallet:
          $ref: "#/components/schemas/Base58"
        transactions:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                required:
                  - id
                  - status
                  - signature
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - submitted
                  signature:
                    type: string
                    description: Base58 transaction signature.
              - type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                      - not_signed
      additionalProperties: false
    RecordResponse:
      type: object
      required:
        - requestId
        - receiptId
        - terminal
        - transactions
        - items
      properties:
        requestId:
          type: string
        receiptId:
          type: string
        terminal:
          type: boolean
          description: True on 200
          false on 202.: null
        transactions:
          type: array
          items:
            type: object
            required:
              - id
              - outcome
            properties:
              id:
                type: string
              signature:
                type:
                  - string
                  - "null"
              outcome:
                type: string
                enum:
                  - verified_success
                  - verified_failure
                  - pending
                  - unknown
                  - duplicate
                  - not_signed_pending_expiry
                  - abandoned_unknown
              landedSlot:
                type:
                  - integer
                  - "null"
        items:
          type: array
          items:
            type: object
            required:
              - id
              - transactionId
              - outcome
              - creditPurpose
              - creditState
            properties:
              id:
                type: string
              transactionId:
                type: string
              outcome:
                type: string
                enum:
                  - verified_applied
                  - verified_not_applied
                  - verified_failed
                  - pending
                  - unknown
                  - abandoned_unknown
              creditPurpose:
                type:
                  - string
                  - "null"
                enum:
                  - api_execution
                  - website_cashback
                  - partner_credit
                  - null
                description: |
                  Which purpose holds the canonical reservation for this
                  item's signature, or null while no signature exists
                  (`not_signed`, `not_signed_pending_expiry`,
                  `abandoned_unknown`) or no reservation has been made yet.
                  `api_execution` is the normal preview value and creates no
                  credit. `website_cashback` or `partner_credit` means that
                  program reserved the signature before this record arrived;
                  the execution outcome is still verified and recorded here,
                  and no second credit is applied. Independent of `outcome`.
              creditState:
                type:
                  - string
                  - "null"
                enum:
                  - reserved
                  - held
                  - published
                  - null
                description: |
                  `reserved` means the purpose holder claimed the signature;
                  `held` means a legacy claim without ledger evidence that is
                  awaiting Admin reconciliation; `published` means the holder
                  committed its ledger entry. Neither `reserved` nor `held`
                  is proof of payment. Null whenever `creditPurpose` is null.
              recovered:
                $ref: "#/components/schemas/Amount"
                description: Present only for `verified_applied`. Net to the wallet after the
                  service fee, derived from on-chain state, never from client
                  input.
              serviceFee:
                $ref: "#/components/schemas/Amount"
              burnedBaseUnits:
                $ref: "#/components/schemas/IntegerString"
                description: |
                  Preview: the amount the landed `burn_and_close` actually
                  burned, from the transaction. Compared server-side with the
                  reviewed balance to measure the section 6 downgrade. Present
                  only for `verified_applied` burn-and-close items.
  responses:
    BadRequest:
      description: Malformed JSON or unsupported request shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: >
        `idempotency_key_reused` (not retryable: same key, different endpoint or
        body) or

        `request_in_progress` (retryable: the owning request is still running;
        keep the same key and retry after `Retry-After`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooLarge:
      description: Request body too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Customer rate or concurrency limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: 30-second deadline exceeded. Not invoiceable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
