openapi: 3.1.0
info:
  title: Unclaimed API
  version: 0.1.0-preview
  summary: Mounted safe-mode wallet analysis preview
  description: "Contract for the implemented POST /api/v1/check-wallet route.
    Analysis only: every opportunity has executionSupported: false and
    executionSession is null. No build, record, usage, payment or transaction
    execution capability is offered. This artifact does not establish deployment
    or live-provider readiness. The separate preview.yaml retains the future
    design."
servers:
  - url: /api/v1
    description: Relative to the operator-provided platform origin; no deployment is
      implied.
security:
  - apiKey: []
tags:
  - name: analysis
    description: Metered wallet analysis.
paths:
  /check-wallet:
    post:
      tags:
        - analysis
      operationId: checkWallet
      summary: Analyze one wallet page
      description: Analyze a frozen wallet page in safe mode. Required lookup failures
        return an incomplete error without a partial or invoiceable page. At
        most 400 raw token accounts; each page accepts limit 1–200 (default 20).
        First-page excess results may overlap cleanup; alternative groups must
        not be added together. Idempotency is mandatory, including retries.
        Execution is unavailable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SdkVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckWalletRequest"
      responses:
        "200":
          description: Complete page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckWalletResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Revoked key, or `mode_not_permitted`: the key lacks the `max`
            capability. Never silently downgraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "410":
          description: "snapshot_expired: the shared 60-minute snapshot and cursor
            lifetime expired; start a new first page. No execution session is
            issued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          description: Unsupported JSON content encoding or charset. Journaled without
            admission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            `mode_not_available` (max analysis is not mounted yet),
            `invalid_wallet`, `cursor_mismatch`, `airdrops_not_available`
            (Preview), `wallet_too_large` (Preview: more than 400 raw token
            accounts), or a v1 module limit exceeded. Not invoiceable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Sanitized internal analysis failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: |
            `incomplete` (Preview: a required lookup on this page failed after
            bounded retry; retry with the same cursor), `upstream_unavailable`,
            or `platform_unavailable` (retryable persistence/service failure).
            Retry platform failures with the same Idempotency-Key and request:
            an uncertain commit may already have a durable response to replay.
            The error response itself does not publish an invoiceable page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "504":
          $ref: "#/components/responses/Timeout"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Customer API key. Never sent to `/build` or `/executions/record`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required, 1–128 printable non-space ASCII characters. Same
