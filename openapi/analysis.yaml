                pageLimitMax:
                  type: integer
                  enum:
                    - 200
        billing:
          $ref: "#/components/schemas/Billing"
    IntegerString:
      type: string
      pattern: ^[0-9]+$
      description: Integer base units as a decimal string. Never a JSON number.
    WalletItem:
      type: object
      description: One discriminated item. Preview omits `discardEvidence` and
