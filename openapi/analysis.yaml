            confidence:
              type: string
              enum:
                - known
                - high
                - low
            reviewRequired:
              type: boolean
            reasons:
              type: array
              items:
                type: string
                enum:
                  - zero_balance
                  - priced_dust_within_policy
                  - sell_not_supported_in_preview
                  - above_dust_threshold
                  - above_net_rent
                  - frozen
                  - collectible
                  - lp_or_position_shaped
                  - receipt_token_policy
                  - dangerous_token_2022_extension
                  - account_missing
                  - unsupported_account
                  - positive_wsol
                  - unpriced
                  - completed_no_sell_route
                  - unsupported_signer
                  - non_positive_net
                  - excess_above_rent_exempt_minimum
