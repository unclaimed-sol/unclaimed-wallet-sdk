                type: string
                enum:
                  - frozen
                  - collectible
                  - lp_position
                  - receipt_token
                  - token_2022_extension
                  - unpriced
                  - account_state
        market:
          type: object
          description: Present on fungible token-account items.
          required:
            - quoteStatus
            - sellRouteAvailable
            - executableQuoteUsd
            - quotedAt
          properties:
            quoteStatus:
              type: string
              enum:
                - complete
                - unavailable
            sellRouteAvailable:
