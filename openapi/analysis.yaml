        - if:
            required:
              - account
            properties:
              account:
                properties:
                  program:
                    const: token_2022
          then:
            properties:
              source:
                const: token_2022
        - if:
            required:
              - market
          then:
            required:
              - account
              - asset
            properties:
              kind:
                const: token_account
              asset:
                properties:
                  assetType:
                    const: fungible
        - if:
            properties:
              opportunity:
                properties:
                  action:
                    const: burn_and_close
          then:
            required:
              - account
              - asset
            properties:
              kind:
                const: token_account
              source:
                enum:
                  - spl_token
                  - token_2022
              classification:
                properties:
                  disposition:
                    enum:
                      - closeable_empty
                  reviewRequired:
                    const: true
                  protections:
                    maxItems: 0
        - if:
            properties:
              classification:
                properties:
                  disposition:
                    const: closeable_empty
          then:
            required:
              - account
              - asset
            properties:
              account:
                properties:
                  balanceBaseUnits:
                    const: "0"
              opportunity:
                properties:
                  action:
                    const: burn_and_close
                  reviewedBalanceBaseUnits:
                    const: "0"
        - if:
            properties:
              classification:
                properties:
                  reasons:
                    contains:
                      enum:
                        - account_missing
                        - unsupported_account
          then:
            properties:
              classification:
                properties:
                  disposition:
                    const: protected
                  protections:
                    contains:
                      const: account_state
              opportunity:
                properties:
                  action:
                    const: none
            not:
              required:
                - market
    DecimalUsd:
      type: string
      pattern: ^[0-9]+\.[0-9]{6}$
      description: USD with six decimals, as a string.
    BurnAndCloseOpportunity:
      type: object
      description: |
        Preview downgrade (contract section 6): executes on the existing
        on-chain instruction, which burns whatever balance is present when the
        transaction runs. Every instance is destructive and carries the
        consent text, including accounts reviewed as empty.
      required:
        - action
        - destructive
        - executionSupported
        - consent
        - reviewedBalanceBaseUnits
        - valueComponents
        - costs
        - estimatedNetValueUsd
        - estimated
      properties:
        action:
          type: string
          enum:
            - burn_and_close
        destructive:
          type: boolean
          enum:
            - true
        executionSupported:
          type: boolean
          const: false
          description: Execution is unavailable in this analysis-only stage.
        consent:
          type: string
          minLength: 1
          description: Exact text the integration must show before signing. States the
            reviewed balance and that execution burns whatever balance is
            present when the transaction runs; for `assumed_worthless` items
            also that no price was available.
        reviewedBalanceBaseUnits:
          $ref: "#/components/schemas/IntegerString"
          description: The balance the user is reviewing. Zero for empty-account close.
        valueComponents:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/ValueComponent"
              - properties:
                  source:
                    const: token_account_close
        costs:
          $ref: "#/components/schemas/OpportunityCosts"
        estimatedNetValueUsd:
          type:
            - string
            - "null"
        estimated:
          type: boolean
          enum:
            - true
    ValueComponent:
      type: object
      required:
        - source
        - gross
        - serviceFee
        - netAfterServiceFee
      properties:
        source:
          type: string
          enum:
            - token_account_close
            - excess_lamports
        gross:
          $ref: "#/components/schemas/Amount"
        serviceFee:
          $ref: "#/components/schemas/Amount"
        netAfterServiceFee:
          $ref: "#/components/schemas/Amount"
    Amount:
      type: object
      required:
        - asset
        - decimals
        - baseUnits
      properties:
        asset:
          type: string
          description: "`SOL` in the preview. Other assets appear only when a fee or gross
            value is denominated in them."
        mint:
          $ref: "#/components/schemas/Base58"
        decimals:
          type: integer
          minimum: 0
          maximum: 18
        baseUnits:
          $ref: "#/components/schemas/IntegerString"
    OpportunityCosts:
      type: object
      required:
        - scope
        - oneTimeSetup
        - estimatedNetworkFee
        - nativeFundingRequired
      properties:
        scope:
          type: string
          enum:
            - standalone_estimate
        oneTimeSetup:
          $ref: "#/components/schemas/Amount"
        estimatedNetworkFee:
          $ref: "#/components/schemas/Amount"
        nativeFundingRequired:
          $ref: "#/components/schemas/Amount"
    RecoverExcessLamportsOpportunity:
      type: object
      required:
        - action
        - destructive
        - executionSupported
        - valueComponents
        - costs
        - estimatedNetValueUsd
        - estimated
      properties:
        action:
          type: string
          enum:
            - recover_excess_lamports
        destructive:
          type: boolean
          enum:
            - false
        executionSupported:
          type: boolean
          const: false
          description: Execution is unavailable in this analysis-only stage.
        valueComponents:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/ValueComponent"
              - properties:
                  source:
                    const: excess_lamports
        costs:
          type: "null"
          description: Null while the analysis adapter supplies no network/funding
            estimate. Never infer zero cost.
        estimatedNetValueUsd:
          type: "null"
          description: No USD valuation is supplied by this analysis adapter.
        estimated:
          type: boolean
          enum:
            - true
    NoActionOpportunity:
      type: object
      description: Protected, review-only, and no-op items. Never executable.
      required:
        - action
        - destructive
        - executionSupported
        - valueComponents
        - estimated
      properties:
        action:
          type: string
          enum:
            - none
        destructive:
          type: boolean
          enum:
            - false
        executionSupported:
          type: boolean
          enum:
            - false
        valueComponents:
          type: array
          maxItems: 0
        estimated:
          type: boolean
          enum:
            - true
    Billing:
      type: object
      description: |
        Preview: `mode` is always `metered_preview`. `chargedUsd` is the list
        price recorded for this complete response and is invoiceable by manual
        invoice only. `balanceRemainingUsd` is always null because no prepaid
        balance exists in the preview.
      required:
        - mode
        - currency
        - billableUnits
        - baseChargeUsd
        - addOnChargeUsd
        - chargedUsd
        - balanceRemainingUsd
      properties:
        mode:
          type: string
          enum:
            - metered_preview
        currency:
          type: string
          enum:
            - USD
        billableUnits:
          type: integer
          minimum: 1
        baseChargeUsd:
          $ref: "#/components/schemas/DecimalUsd"
        addOnChargeUsd:
          $ref: "#/components/schemas/DecimalUsd"
        chargedUsd:
          $ref: "#/components/schemas/DecimalUsd"
        balanceRemainingUsd:
          type: "null"
    ErrorEnvelope:
      type: object
      required:
        - requestId
        - error
      properties:
        requestId:
          type: string
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - key_revoked
                - mode_not_permitted
                - mode_not_available
                - idempotency_key_reused
                - request_in_progress
                - snapshot_expired
                - request_too_large
                - invalid_wallet
                - cursor_mismatch
                - airdrops_not_available
                - wallet_too_large
                - module_limit_exceeded
                - rate_limited
                - internal_error
                - invalid_idempotency_key
                - platform_unavailable
                - invalid_request
                - incomplete
                - upstream_unavailable
                - deadline_exceeded
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: Never contains upstream URLs, credentials, raw RPC messages, or
                provider names.
  responses:
    BadRequest:
      description: Malformed JSON or unsupported request shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: >
        `idempotency_key_reused` (not retryable: same key, different endpoint or
        body) or

        `request_in_progress` (retryable: the owning request is still running;
        keep the same key and retry after `Retry-After`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooLarge:
      description: Request body too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Customer rate or concurrency limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Timeout:
      description: 30-second deadline exceeded. Not invoiceable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
