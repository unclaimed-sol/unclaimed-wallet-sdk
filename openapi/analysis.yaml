            - decimals
          properties:
            mint:
              $ref: "#/components/schemas/Base58"
            assetType:
              type: string
              enum:
                - fungible
                - token_account_collectible
                - unknown
            symbol:
              type:
                - string
                - "null"
            decimals:
              type: integer
        account:
          type: object
          required:
            - address
            - program
            - balanceBaseUnits
            - rentLamports
          additionalProperties: false
          properties:
            address:
              $ref: "#/components/schemas/Base58"
            program:
              type: string
              enum:
                - spl_token
                - token_2022
            balanceBaseUnits:
